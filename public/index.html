<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAU Owl Weather</title>
  <meta name="description" content="Weather forecast for Boca Raton and anywhere else, powered by Open-Meteo.">
  <meta name="theme-color" content="#003366">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img class="brand-logo" src="assets/fau-logo.png" alt="Florida Atlantic University"
           onerror="this.hidden=true; document.getElementById('wordmark').hidden=false;">
      <span id="wordmark" class="wordmark" hidden>FAU</span>
      <span class="brand-title">Owl Weather</span>
    </div>
    <form id="search-form" class="search" autocomplete="off" role="search" hidden>
      <label for="search-input" class="visually-hidden">Search city</label>
      <input id="search-input" type="search" placeholder="Search a city…" required>
      <button type="submit">Search</button>
      <ul id="search-results" class="search-results" hidden></ul>
    </form>
    <div id="user-bar" class="user-bar" hidden>
      <span id="user-email"></span>
      <button id="sign-out" type="button">Sign out</button>
    </div>
  </header>

  <main class="container">
    <section id="auth" class="card auth" hidden>
      <h1 id="auth-title">Sign in</h1>
      <form id="auth-form">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" required>
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required>
        <button id="auth-submit" type="submit">Sign in</button>
      </form>
      <p id="auth-message" class="auth-message" role="alert"></p>
      <p class="muted">
        <span id="auth-switch-text">No account?</span>
        <button id="auth-switch" type="button" class="link-button">Create one</button>
      </p>
    </section>

    <p id="status" class="status" role="status" hidden></p>

    <section id="current" class="card current" hidden>
      <div>
        <h1 id="location-name"></h1>
        <p id="updated" class="muted"></p>
      </div>
      <div class="current-main">
        <span id="current-icon" class="big-icon" aria-hidden="true"></span>
        <span id="current-temp" class="big-temp"></span>
      </div>
      <p id="current-desc" class="current-desc"></p>
      <dl class="stats">
        <div><dt>Feels like</dt><dd id="feels-like"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>UV index</dt><dd id="uv"></dd></div>
        <div><dt>Sunrise</dt><dd id="sunrise"></dd></div>
        <div><dt>Sunset</dt><dd id="sunset"></dd></div>
      </dl>
    </section>

    <section id="hourly-section" class="card" hidden>
      <h2>Next 24 hours</h2>
      <ol id="hourly" class="hourly"></ol>
    </section>

    <section id="daily-section" class="card" hidden>
      <h2>7-day forecast</h2>
      <ol id="daily" class="daily"></ol>
    </section>
  </main>

  <footer class="site-footer">
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0).
    Go Owls!
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
